# fluorite_c1_sr069: designed by design.py (rescue experiment: sr069).
# F = small (+, r=90nm) on the majority site; Ca = large (-, r=130nm).
# lambda_D solved so the unlike-pair well is -5.0 kT.
# weakest species F held at -19.8 kT (CsCl, which survives, holds both at about -25 kT).
name: fluorite_c1_sr069
cif: fluorite_C1.cif
lattice_repeats: 8
types:
  F:
    radius_nm: 90.0
    mass_dalton: 1.884998982291879
    surface_potential_mV: 5.0
  Ca:
    radius_nm: 130.0
    mass_dalton: 1.0
    surface_potential_mV: -25.0
debye_length_nm: 18.53
potential_temperature_K: 298.0
brush_length_nm: 10.0
brush_density_per_nm2: 0.09
dielectric_constant: 80.0
cutoff_factor: 21.0
radii_padding_nm: 15.0
lattice_padding_nm: 1000.0
optimize_energy: true
energy_scale_range:
- 0.5
- 1.5
energy_scale_samples: 50
start_temperature_K: 30.0
ramp_steps: 200000
run_steps: 500000
n_frames: 500
timestep_ps: 0.3
friction_per_ps: 1.0
seed: 1
use_gravity: true
particle_density_g_per_cm3: 1.05
water_density_g_per_cm3: 0.998
walls:
- true
- true
- true
platform: CUDA
