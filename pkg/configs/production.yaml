# Frozen production configuration.
#
# Every number here is a scientific decision, not a tuning knob. Provenance is given so a
# reader can trace each value back to the run that fixed it. Changing any of them makes
# the output incomparable with the published results.

preprocessing:
  # Radius-normalised separation s = d_ij / (R_i + R_j).
  contact_multiplier: 1.62        # s < 1.62 defines a physical contact / component
  graph_multiplier: 1.35          # s < 1.35 defines the contact graph for coordination
  mean_r4_star_threshold: 1.2698  # gas if mean over 4 nearest of d/(R_i+R_j) exceeds this
  # NOTE: mean_r4_star assumes a cohesive particle has ~4 near contacts. Open frameworks
  # violate it -- on an ideal ReO3 anchor it removed the whole majority sublattice
  # (5324 particles in, 1330 out). See docs/LIMITATIONS.md.

m3:
  # A particle is excluded as a SOAP CENTRE (not deleted) when both hold.
  exposure_threshold: 0.14        # exposure = ||sum unit(r_j - r_i)|| / coordination
  coordination_threshold: 13

soap:
  n_max: 8
  l_max: 6
  r_cut: 3.0                      # in units of d0
  sigma: 0.10                     # in units of d0
  species: [11, 17]               # placeholder Z for LARGE, SMALL
  dimension: 952                  # asserted at runtime; (16*17/2)*7
  # d0 = median nearest-neighbour distance within the physical component, so every
  # length is expressed relative to the local lattice scale and the descriptor is
  # scale-free.

ood:
  pca_dimension_per_species: 16   # -> 32-D domain fingerprint [LARGE | SMALL]
  covariance: ledoit_wolf
  # rho = mahalanobis_distance / tau ; reject when rho > 1

retrieval:
  # One-sided chamfer with a median reduction: for each candidate centre, the distance to
  # its nearest environment in the anchor; median over centres, per species, averaged.
  # Replaces the mean-SOAP centroid distance, which could not reject amorphous domains --
  # a diffuse cloud whose centre lands near a prototype's centre reads as that prototype.
  method: chamfer_median
  cover_radius: 0.02              # anchor environments deduplicated at this radius

  # Both gates fitted on the SAME 50 held-out validation trajectories (13 CsCl, 11 Th3P4,
  # 26 amorphous) against all 41 cold anchors. Each separates the populations completely;
  # a domain must clear both. Source: acceptance_cold_frozen.json, method chamfer_median.
  #
  #             crystals      amorphous     window            gap
  #   distance  <= 0.1294     >= 0.1943     [0.1294, 0.1943]  1.50x
  #   margin    >= 3.309      <= 1.590      [1.590, 3.309]    2.08x
  distance_threshold: 0.1619      # midpoint of the distance window
  margin_threshold: 2.45          # midpoint of the margin window

  # Result on that split: CsCl 13/13, Th3P4 11/11, amorphous 0/26 accepted.
  # NOT validated for open frameworks -- see docs/LIMITATIONS.md. The gas screen and the
  # M3 coordination clause both degenerate there, and the 14-family prototype benchmark
  # failed on exactly the seven families that lose most of their particles to screening.
